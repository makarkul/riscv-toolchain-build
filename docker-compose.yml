services:
  toolchain-builder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: riscv-toolchain-builder:jammy
    volumes:
      # Final install prefix — the toolchain payload that ends up inside the .deb
      - ${OUTPUT_DIR:-./toolchain-output}:/opt/riscv-toolchain
      # Working build dir — large, on a docker-managed named volume to avoid
      # exhausting tmpfs / the host root filesystem.
      - build-workspace:/build
      # .deb output (.deb + buildlogs) returned to the host
      - ${DIST_DIR:-./dist}:/dist
      # Patches and sources, mounted read-only — the build script copies them
      # into /build for writability.
      - ./patches:/src/patches:ro
      - ./sources/riscv-gnu-toolchain:/src/riscv-gnu-toolchain:ro
      - ./sources/gcc:/src/gcc:ro
      - ./sources/binutils:/src/binutils:ro
      - ./sources/newlib:/src/newlib:ro
      - ./sources/gdb:/src/gdb:ro
      - ./sources/spike:/src/spike:ro
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      PKG_VERSION: ${PKG_VERSION:-13.4.0-1}

volumes:
  build-workspace:
